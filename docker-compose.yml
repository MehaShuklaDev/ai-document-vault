services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://vault:vault@db:5432/vault
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://vault:vault@db:5432/vault
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /data/blobs
    ports: ["8000:8000"]
    volumes: ["blobs:/data/blobs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "documents", "--concurrency=4", "--loglevel=INFO"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://vault:vault@db:5432/vault
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /data/blobs
    volumes: ["blobs:/data/blobs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      replicas: 1

volumes:
  pgdata:
  blobs:
